name: Bug report
description: Report a reproducible offline CLI problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Use fictional S01–S04 or documented public charts. Never paste real birth data, private locations, logs, or personalized reports.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Prophet version, OS, Python and Node versions, and relevant optional dependencies.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal command using fictional or public inputs; include rule flags.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include sanitized JSON warnings and a public source for numeric expectations.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real birth data or other private information.
          required: true
