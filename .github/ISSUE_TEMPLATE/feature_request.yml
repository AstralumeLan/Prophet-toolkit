name: Feature request
description: Suggest a rule, engine, or usability improvement.
title: '[Feature] '
body:
  - type: textarea
    id: need
    attributes:
      label: Problem and proposed behavior
      description: Explain the workflow and alternatives. Use fictional examples only.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Public references and licensing
      description: For rules or datasets, link public references and explain provenance, uncertainty, and licence restrictions.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no real birth data or other private information.
          required: true
